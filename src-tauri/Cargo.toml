[package]
name = "git-factory"
version = "0.2.0"
description = "A controlled delivery line for software change"
edition = "2021"
rust-version = "1.90"
default-run = "git-factory"

[[bin]]
name = "factory-cli"
path = "src/bin/factory-cli.rs"

[lib]
name = "git_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomic-write-file = "0.3"
base64 = "0.23"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "7", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
