[package]
name = "git-factory"
version = "0.4.0"
description = "A controlled delivery line for software change"
edition = "2021"
rust-version = "1.90"
default-run = "git-factory"

[[bin]]
name = "factory-cli"
path = "src/bin/factory-cli.rs"

[lib]
name = "git_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomic-write-file = "0.3"
base64 = "0.23"
directories = "6"
dunce = "1"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
jsonschema = { version = "0.46", default-features = false }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
rmcp = { version = "3.11", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
libc = "0.2"
process-wrap = { version = "10", features = ["tokio1", "process-group", "job-object"] }
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
