[package]
name = "git-factory"
version = "0.1.0"
description = "A controlled delivery line for software change"
edition = "2021"
rust-version = "1.90"

[lib]
name = "git_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
